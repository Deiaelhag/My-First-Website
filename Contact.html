<head>

<body>
    <!--Navigation bar-->

    <h1 id="text">Contact Us</h1>

    <!--Contact form-->
    <form onsubmit="showMessage()">
        <label for="name">Name:</label>
        <input id="name" type="text" required /><!--the required works only when uses the button"submit"-->
        <br /><br />

        <!--Inputs-->
        <label for="email">Email:</label>
        <input id="email" type="email" required />
        <br /><br />

        <label for="message">Your Message:</label>
        <br />
        <textarea id="message" rows="7" cols="35" required></textarea><!--Message box-->
        <br /><br />

        <button type="submit" style="font-size:20px">Send</button><!--Button-->
    </form>
    <br /><br />
    <!--Buttons-->
    <button onclick="changeColor()">Change Color</button>
    <br /><br />
    <button onclick="darkMood()">Dark Mood</button>

    <button onclick="reloadPage()" style="float:right">Reload Page</button>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <!--External JavaScript file-->
    <script src="script.js"></script>
</body>
